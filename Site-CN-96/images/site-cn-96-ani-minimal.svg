    <style>
        /* <![CDATA[ */
        svg[viewBox="0 0 1000 1000"] #v-belt {
            animation: shaky 3s ease-in-out infinite normal forwards;
        }

        @keyframes shaky {
            0% {
                transform: translate(0, 0);
            }

            3% {
                transform: translate(0.5px, 0);
            }

            10% {
                transform: translate(0, 0);
            }

            13% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(0.5px, 0);
            }

            23% {
                transform: translate(0, -0.5px);
            }

            33% {
                transform: translate(0, 0);
            }

            36% {
                transform: translate(0.5px, 0);
            }

            46% {
                transform: translate(0, 0);
            }

            53% {
                transform: translate(0.5px, -1px);
            }

            60% {
                transform: translate(0, -0.5px);
            }

            63% {
                transform: translate(0, -1px);
            }

            73% {
                transform: translate(0, 0);
            }

            83% {
                transform: translate(0.5px, 0);
            }

            86% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(0, -0.5px);
            }
        }

        svg[viewBox="0 0 1000 1000"] #working-wire {
            animation: drilling 3s cubic-bezier(0.25, 0.1, 0.64, 1) infinite normal forwards;
        }

        @keyframes drilling {
            0% {
                transform: translate(0, -70px);
            }

            50% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(0, -70px);
            }
        }

        svg[viewBox="0 0 1000 1000"] #hammer {
            animation: hammer-rotate 3s cubic-bezier(0.25, 0.1, 0.64, 1) infinite normal forwards;
            transform-origin: 562.2px 390.1px;
        }

        @keyframes hammer-rotate {
            0% {
                transform: rotate(-20deg);
            }

            50% {
                transform: rotate(20deg);
            }

            100% {
                transform: rotate(-20deg);
            }
        }

        svg[viewBox="0 0 1000 1000"] #small-hammer {
            animation: small-hammer-rotate 3s linear infinite normal forwards;
            transform-origin: 415px 601px;
        }

        @keyframes small-hammer-rotate {
            0% {
                transform: rotate(486deg);
            }

            50% {
                transform: rotate(306deg);
            }

            100% {
                transform: rotate(126deg);
            }
        }

        svg[viewBox="0 0 1000 1000"] #link {
            animation: link-ani-merged 3s linear infinite normal forwards;
            transform-origin: 449.75px 504.44px;
        }

